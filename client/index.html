<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyGroceries - Premium Groceries</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">DailyGroceries</div>
    <div class="nav-links">
      <button id="view-cart-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>
  <main id="main-content">
    <section class="hero">
      <h1>Fresh Groceries, Delivered Fast</h1>
      <p>Premium quality ingredients sourced directly from organic farms.</p>
    </section>

    <div class="category-filters" id="category-filters">
      <button class="filter-btn active" data-category="All">All</button>
      <button class="filter-btn" data-category="Fruits">Fruits</button>
      <button class="filter-btn" data-category="Vegetables">Vegetables</button>
      <button class="filter-btn" data-category="Dairy">Dairy</button>
      <button class="filter-btn" data-category="Bakery">Bakery</button>
      <button class="filter-btn" data-category="Meat">Meat</button>
      <button class="filter-btn" data-category="Seafood">Seafood</button>
      <button class="filter-btn" data-category="Pantry">Pantry</button>
      <button class="filter-btn" data-category="Beverages">Beverages</button>
    </div>

    <section class="products-container" id="products-list">
      <!-- Products will be injected here -->
      <div class="loader">Loading fresh products...</div>
    </section>
  </main>

  <!-- Cart Modal Overlay -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Your Cart</h2>
        <button id="close-cart-btn" class="icon-btn">&times;</button>
      </div>
      <div class="modal-body" id="cart-items">
        <!-- Cart items here -->
      </div>
      
      <!-- Checkout Form -->
      <div class="modal-body" id="checkout-form" style="display: none;">
        <form id="delivery-form">
          <div class="form-group">
            <label for="cust-name">Full Name</label>
            <input type="text" id="cust-name" required placeholder="John Doe" class="form-input">
          </div>
          <div class="form-group">
            <label for="cust-email">Email Address</label>
            <input type="email" id="cust-email" required placeholder="john@example.com" class="form-input">
          </div>
          <div class="form-group">
            <label for="cust-address">Delivery Address</label>
            <textarea id="cust-address" required placeholder="123 Grocery St, Foodville" rows="3" class="form-input"></textarea>
          </div>
        </form>
      </div>

      <div class="modal-footer" id="cart-footer">
        <div class="total-row"><span>Total:</span> <span id="cart-total">$0.00</span></div>
        <button id="checkout-btn" class="primary-btn">Proceed to Checkout</button>
      </div>
      
      <div class="modal-footer" id="checkout-footer" style="display: none; flex-direction: column; gap: 0.5rem;">
        <button id="place-order-btn" class="primary-btn" form="delivery-form">Place Order</button>
        <button id="back-to-cart-btn" class="secondary-btn" type="button">Back to Cart</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="./app.js"></script>
</body>
</html>
